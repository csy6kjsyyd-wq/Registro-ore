<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🗂️</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg: #080d1a;
  --card: #111c30;
  --card-border: rgba(96,165,250,.10);
  --muted: #6b7fa8;
  --text: #dce6f8;
  --text-dim: #a0b0cc;
  --blue: #60a5fa;
  --violet: #a78bfa;
  --teal: #2dd4bf;
  --shadow: 0 24px 48px rgba(0,0,0,.5);
  --radius: 14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{
  min-height:100%;
  background:
    radial-gradient(ellipse 900px 500px at 5% 0%, rgba(96,165,250,.13) 0%, transparent 65%),
    radial-gradient(ellipse 700px 400px at 95% 15%, rgba(167,139,250,.11) 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial;
  color:var(--text);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:16px 16px 64px;
}
.container{width:100%;max-width:900px;}

.header{display:flex;align-items:center;gap:14px;margin-bottom:32px;}
.header-icon{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--blue),var(--violet));
  display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 0 20px rgba(96,165,250,.25);
}
.header-icon svg{stroke:#fff;fill:none;}
.header-text h1{
  font-size:1.5rem;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--text) 50%,var(--violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
flex-shrink: 0;
}
.header-text p{color:var(--muted);font-size:.85rem;margin-top:2px;}
.header-actions{margin-left:auto;display:flex;gap:10px;}

.card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 28px 24px;
}
.section-label{
  display:flex;align-items:center;gap:8px;
  font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:16px;
}
.section-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.06),transparent);}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;}
.col-6{grid-column:span 6;}
.col-12{grid-column:span 12;}
@media(max-width:640px){.col-6{grid-column:span 12;}}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:.78rem;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;}
input[type="date"],select,input[type="text"],input[type="password"],textarea{
  width:100%;padding:13px 14px;border-radius:10px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.025);
  color:var(--text);font-size:.95rem;font-family:inherit;
  transition:border-color .2s,box-shadow .2s;
  outline:none;appearance:none;-webkit-appearance:none;
}
input[type="date"]:focus,select:focus,input[type="text"]:focus,input[type="password"]:focus,textarea:focus{
  border-color:rgba(96,165,250,.45);box-shadow:0 0 0 3px rgba(96,165,250,.08);
}
select option{background:#111c30;color:var(--text);}
textarea{resize:vertical;min-height:70px;}

.lavori-container{display:flex;flex-direction:column;gap:12px;margin-top:4px;}
.lavoro-block{
  border:1px solid rgba(255,255,255,.06);border-radius:12px;
  padding:16px;background:rgba(255,255,255,.015);
}
.lavoro-block-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.lavoro-block-num{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);}
.btn-remove-block{
  background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);
  color:#fca5a5;border-radius:8px;padding:5px 10px;
  font-size:.75rem;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;font-family:inherit;transition:background .15s;
}
.btn-remove-block:hover{background:rgba(239,68,68,.22);}

.totale-bar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:22px;padding:16px 18px;border-radius:12px;
  background:linear-gradient(90deg,rgba(96,165,250,.07),rgba(167,139,250,.07));
  border:1px solid rgba(96,165,250,.12);
}
.totale-label{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.totale-value{
  font-size:1.5rem;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(90deg,var(--blue),var(--violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.actions{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap;}
.actions .btn{flex:1;justify-content:center;}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:none;border-radius:10px;padding:11px 18px;
  font-size:.88rem;font-weight:700;cursor:pointer;
  transition:filter .15s,transform .1s;font-family:inherit;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.6;cursor:default;}
.btn-primary{
  background:linear-gradient(90deg,var(--blue),var(--violet));
  color:#06101f;box-shadow:0 4px 16px rgba(96,165,250,.25);
}
.btn-primary:hover{filter:brightness(1.1);}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text-dim);border:1px solid rgba(255,255,255,.10);}
.btn-ghost:hover{background:rgba(255,255,255,.07);}
.btn-warning{background:rgba(251,191,36,.10);color:#fde68a;border:1px solid rgba(251,191,36,.20);}
.btn-warning:hover{background:rgba(251,191,36,.18);}
.btn-add{
  background:rgba(96,165,250,.08);color:var(--blue);
  border:1px dashed rgba(96,165,250,.30);
  width:100%;justify-content:center;margin-top:4px;padding:10px;border-radius:10px;
}
.btn-add:hover{background:rgba(96,165,250,.14);}

.status{
  display:none;margin-top:14px;padding:12px 16px;border-radius:10px;
  border:1px solid rgba(45,212,191,.20);background:rgba(45,212,191,.06);
  color:#99f6e4;font-size:.88rem;font-weight:600;align-items:center;gap:8px;
}
.status.show{display:flex;}
.errore{
  display:none;margin-top:14px;padding:12px 16px;border-radius:10px;
  border:1px solid rgba(239,68,68,.20);background:rgba(239,68,68,.06);
  color:#fca5a5;font-size:.88rem;font-weight:600;align-items:center;gap:8px;
}
.errore.show{display:flex;}

.mod-filtri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}
@media(max-width:640px){.mod-filtri{grid-template-columns:1fr;}}
.mod-results{display:flex;flex-direction:column;gap:16px;}
.mod-giorno{border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:18px;background:rgba(255,255,255,.012);}
.mod-giorno-data{font-size:.95rem;font-weight:700;color:var(--blue);margin-bottom:14px;}
.mod-attivita{display:flex;flex-direction:column;gap:10px;}
.mod-att-row{
  border:1px solid rgba(255,255,255,.05);border-radius:10px;
  padding:14px;background:rgba(255,255,255,.02);
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
@media(max-width:600px){.mod-att-row{grid-template-columns:1fr;}}
.mod-att-row .col-full{grid-column:1/-1;}
.mod-att-header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.mod-att-num{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.btn-del-att{
  background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.18);
  color:#fca5a5;border-radius:7px;padding:4px 9px;
  font-size:.72rem;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;font-family:inherit;transition:background .15s;
}
.btn-del-att:hover{background:rgba(239,68,68,.22);}
.mod-empty{text-align:center;padding:32px;color:var(--muted);font-size:.9rem;}
.mod-bottom{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:20px;}
.mod-bottom .btn{white-space:nowrap;min-width:130px;justify-content:center;}

.login-wrap{max-width:380px;margin:80px auto 0;}
.tabs{display:flex;gap:8px;margin-bottom:20px;}
.tab-btn{
  flex:1;border:none;border-radius:10px;padding:10px;cursor:pointer;
  background:rgba(255,255,255,.04);color:var(--text-dim);
  font-size:.82rem;font-weight:700;font-family:inherit;border:1px solid rgba(255,255,255,.08);
}
.tab-btn.attivo{background:linear-gradient(90deg,var(--blue),var(--violet));color:#06101f;border-color:transparent;}

.op-list{display:flex;flex-direction:column;gap:10px;}
.op-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px 16px;
  background:rgba(255,255,255,.015);
}
.op-nome{font-size:.9rem;font-weight:600;}
.op-stato{font-size:.75rem;color:var(--muted);margin-top:2px;}

.toggle-group{display:flex;gap:8px;margin-bottom:16px;}
.toggle-btn{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);color:var(--text-dim);font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;transition:filter .15s;}
.toggle-btn.attivo{background:linear-gradient(90deg,var(--blue),var(--violet));color:#06101f;border-color:transparent;}

.table-wrapper{overflow-x:auto;background:rgba(255,255,255,.015);border-radius:12px;border:1px solid rgba(255,255,255,.06);padding:8px;margin-top:16px;}
.table-wrapper table{width:100%;border-collapse:collapse;min-width:500px;}
.table-wrapper th{color:var(--blue);font-size:.7rem;padding:12px;text-align:left;border-bottom:1px solid var(--card-border);text-transform:uppercase;letter-spacing:.12em;}
.table-wrapper td{padding:14px;border-top:1px solid rgba(255,255,255,.05);font-size:.9rem;color:var(--text);}
.table-wrapper tbody tr{cursor:pointer;}
.table-wrapper tbody tr:hover{background:rgba(255,255,255,.04);}

.print-area{position:absolute;left:-9999px;top:0;width:700px;background:#fff;padding:30px;font-family:sans-serif;}
.print-area h1{font-size:18px;margin-bottom:4px;color:#000;}
.print-area h3{color:#1d4ed8;margin:18px 0 6px;font-size:15px;}
.print-area table{width:100%;border-collapse:collapse;margin-top:10px;}
.print-area th,.print-area td{border:1px solid #999;padding:8px;font-size:13px;color:#000;text-align:left;}
.print-area th{background:#eee;}
</style>
</head>
<body>
<div class="container">

<div id="vistaLogin" class="login-wrap">
  <div class="header">
    <div class="header-icon"><svg width="22" height="22" stroke-width="2" viewBox="0 0 24 24" style="stroke:#fff;fill:none;"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
    <div class="header-text"><h1>Area riservata</h1><p>Accesso amministratore</p></div>
  </div>
  <div class="card">
    <div class="field"><label>Password</label><input type="password" id="adminPass" autocomplete="off" /></div>
    <button class="btn btn-primary" id="btnAdminLogin" style="width:100%;justify-content:center;margin-top:16px;">Accedi</button>
    <div class="errore" id="loginErrore"></div>
  </div>
</div>

<div id="vistaApp" style="display:none;">
  <div class="header">
    <div class="header-icon">
      <svg width="22" height="22" stroke-width="2" viewBox="0 0 24 24" id="headerSvg" style="stroke:#fff; fill:none;">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>
    <div class="header-text">
      <h1 id="headerTitle">Registro Ore Lavorate</h1>
      <p id="headerSub">Registrazione presenze giornaliere</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn attivo" id="tabInserisci">Inserisci</button>
    <button class="tab-btn" id="tabModifica">Modifica</button>
    <button class="tab-btn" id="tabVisualizza">Visualizza</button>
    <button class="tab-btn" id="tabPassword">Password operai</button>
  </div>

  <div id="vistaInserisci">
    <div class="card">
      <div class="section-label">Inserimento dati</div>
      <form id="formOre" novalidate>
        <div class="grid">
          <div class="col-6 field">
            <label for="data">Data</label>
            <input id="data" type="date" required />
          </div>
          <div class="col-6 field">
            <label for="nome">Dipendente</label>
            <select id="nome" required>
              <option value="" disabled selected>Seleziona un nome</option>
              <option>Adriano Massimo</option>
              <option>Beltrami Fabrizio</option>
              <option>Beltrami Valeria</option>
              <option>Branchini Sauro</option>
              <option>Loi Stefano</option>
              <option>Longu Alessandro</option>
              <option>Mussini Davide</option>
              <option>Nanetti Marco</option>
              <option>Pascarella Antonio</option>
              <option>Romani Nadia</option>
              <option>Romani Fabiana</option>
              <option>Santini Fabio</option>
            </select>
          </div>
        </div>
        <div style="margin-top:20px;">
          <div class="section-label">Attività</div>
          <div class="lavori-container" id="lavoriContainer"></div>
          <button type="button" class="btn btn-add" id="btnAggiungi">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Aggiungi attività
          </button>
        </div>
        <div class="totale-bar">
          <div>
            <div class="totale-label">Totale ore</div>
            <div class="totale-value" id="totText">0 h</div>
          </div>
          <div class="actions">
            <button type="submit" class="btn btn-primary" id="btnSalva">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              <span id="btnSalvaLabel">Salva</span>
            </button>
            <button type="button" class="btn btn-ghost" id="pulisci">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
              Pulisci
            </button>
          </div>
        </div>
        <div class="errore" id="insErrore"></div>
      </form>
    </div>
  </div>

  <div id="vistaMod" style="display:none;">
    <div class="card">
      <div class="section-label">Modifica dati</div>
      <div class="mod-filtri">
        <div class="field">
          <label>Anno</label>
          <select id="modAnno"><option value="">— Anno —</option></select>
        </div>
        <div class="field">
          <label>Mese</label>
          <select id="modMese"><option value="">— Mese —</option></select>
        </div>
        <div class="field">
          <label>Dipendente</label>
          <select id="modNome"><option value="">— Dipendente —</option></select>
        </div>
      </div>
      <div class="mod-results" id="modResults">
        <div class="mod-empty">Seleziona anno, mese e dipendente per visualizzare i dati.</div>
      </div>
      <div class="mod-bottom">
        <button class="btn btn-ghost" id="btnAnnulla">Annulla</button>
        <button class="btn btn-primary" id="btnSalvaMod">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span id="btnSalvaModLabel">Salva modifiche</span>
        </button>
      </div>
      <div class="errore" id="modErrore"></div>
    </div>
  </div>

  <div id="vistaPassword" style="display:none;">
    <div class="card">
      <div class="section-label">Password operai</div>
      <div class="op-list" id="opList"></div>
      <div class="errore" id="passErrore"></div>
    </div>
  </div>

  <div id="vistaVis" style="display:none;">
    <div class="card">
      <div class="section-label">Visualizza dati</div>
      <div class="grid">
        <div class="col-6 field">
          <label>Anno</label>
          <select id="visAnno"><option value="">— Seleziona Anno —</option></select>
        </div>
        <div class="col-6 field">
          <label>Mese</label>
          <select id="visMese"><option value="">— Seleziona Mese —</option></select>
        </div>
      </div>
      <div class="field" style="margin-top:16px;">
        <div class="toggle-group">
          <button type="button" class="toggle-btn attivo" id="modoDipendente">Dipendente</button>
          <button type="button" class="toggle-btn" id="modoLuogo">Luogo</button>
        </div>
        <div id="campoDipendente" class="field"><label>Dipendente</label><select id="visNome"><option value="">— Seleziona Dipendente —</option></select></div>
        <div id="campoLuogo" class="field" style="display:none;"><label>Luogo</label><input type="text" id="visLuogo" placeholder="Cerca luogo…"></div>
      </div>
      <div class="actions" style="margin-left:0;">
        <button class="btn btn-primary" id="btnScaricaPdf" style="width:100%;justify-content:center;">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span id="btnScaricaPdfLabel">Scarica PDF</span>
        </button>
      </div>
      <div class="table-wrapper" id="tabellaRisultati"></div>
      <div class="errore" id="visErrore"></div>
    </div>
  </div>

  <div class="print-area" id="printArea"></div>

  <div class="status" id="statusOk"></div>
</div>

</div>

<script>
const NOMI = ['Adriano Massimo','Beltrami Fabrizio','Beltrami Valeria','Branchini Sauro','Loi Stefano','Longu Alessandro','Mussini Davide','Nanetti Marco','Pascarella Antonio','Romani Nadia','Romani Fabiana','Santini Fabio'];

function parseOre(v){
  if(!v) return 0;
  v = String(v).trim().toLowerCase().replace(/h$/,'').replace(/\s+/g,'').replace(',','.');
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : NaN;
}
function fmt(n){ return new Intl.NumberFormat('it-IT',{maximumFractionDigits:2}).format(n); }
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
function formatData(d){
  if(!d) return '';
  const [y,m,g] = d.split('-');
  return g + ' ' + MESI[parseInt(m,10)-1] + ' ' + y;
}

let dati = {};
let operai = [];
let adminPassword = '';

const $vistaLogin = document.getElementById('vistaLogin'), $vistaApp = document.getElementById('vistaApp');
const $adminPass = document.getElementById('adminPass'), $btnAdminLogin = document.getElementById('btnAdminLogin');
const $loginErrore = document.getElementById('loginErrore');

const $vistaIns = document.getElementById('vistaInserisci'), $vistaMod = document.getElementById('vistaMod'), $vistaPass = document.getElementById('vistaPassword');
const $vistaVis = document.getElementById('vistaVis');
const $tabInserisci = document.getElementById('tabInserisci'), $tabModifica = document.getElementById('tabModifica'), $tabPassword = document.getElementById('tabPassword');
const $tabVisualizza = document.getElementById('tabVisualizza');
const $form = document.getElementById('formOre'), $container = document.getElementById('lavoriContainer');
const $btnAggiungi = document.getElementById('btnAggiungi'), $btnSalva = document.getElementById('btnSalva');
const $btnPulisci = document.getElementById('pulisci'), $totText = document.getElementById('totText');
const $btnSalvaLabel = document.getElementById('btnSalvaLabel'), $btnSalvaModLabel = document.getElementById('btnSalvaModLabel');
const $modAnno = document.getElementById('modAnno'), $modMese = document.getElementById('modMese'), $modNome = document.getElementById('modNome');
const $modResults = document.getElementById('modResults'), $btnSalvaMod = document.getElementById('btnSalvaMod');
const $hTitle = document.getElementById('headerTitle'), $hSub = document.getElementById('headerSub');
const $statusOk = document.getElementById('statusOk');
const $insErrore = document.getElementById('insErrore'), $modErrore = document.getElementById('modErrore'), $passErrore = document.getElementById('passErrore');
const $opList = document.getElementById('opList');

const $visAnno = document.getElementById('visAnno'), $visMese = document.getElementById('visMese');
const $visNome = document.getElementById('visNome'), $visLuogo = document.getElementById('visLuogo');
const $campoDipendente = document.getElementById('campoDipendente'), $campoLuogo = document.getElementById('campoLuogo');
const $modoDipendente = document.getElementById('modoDipendente'), $modoLuogo = document.getElementById('modoLuogo');
const $tabellaRisultati = document.getElementById('tabellaRisultati');
const $btnScaricaPdf = document.getElementById('btnScaricaPdf'), $btnScaricaPdfLabel = document.getElementById('btnScaricaPdfLabel');
const $visErrore = document.getElementById('visErrore');
const $printArea = document.getElementById('printArea');

function mostraStatus(msg){
  $statusOk.textContent = msg; $statusOk.classList.add('show');
  setTimeout(()=>$statusOk.classList.remove('show'), 2500);
}
function mostraErrore(el, msg){
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 4000);
}

async function apiCall(action, payload){
  const res = await fetch('/api', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({ action }, payload))
  });
  const out = await res.json();
  if(!res.ok) throw new Error(out.error || 'Errore di rete');
  return out;
}

$btnAdminLogin.addEventListener('click', async () => {
  $loginErrore.classList.remove('show');
  const pass = $adminPass.value;
  if(!pass) return;
  $btnAdminLogin.disabled = true;
  try{
    const out = await apiCall('get-admin', { password: pass });
    adminPassword = pass;
    dati = out.dati || {};
    operai = out.operai || [];
    $vistaLogin.style.display = 'none';
    $vistaApp.style.display = 'block';
    creaBlock(1);
  }catch(e){
    mostraErrore($loginErrore, e.message);
  }finally{
    $btnAdminLogin.disabled = false;
  }
});
$adminPass.addEventListener('keydown', e => { if(e.key === 'Enter') $btnAdminLogin.click(); });

function attivaTab(nome){
  [$vistaIns, $vistaMod, $vistaPass, $vistaVis].forEach(v => v.style.display = 'none');
  [$tabInserisci, $tabModifica, $tabPassword, $tabVisualizza].forEach(t => t.classList.remove('attivo'));
  if(nome === 'inserisci'){
    $vistaIns.style.display = 'block'; $tabInserisci.classList.add('attivo');
    $hTitle.textContent = "Registro Ore Lavorate"; $hSub.textContent = "Registrazione presenze giornaliere";
  } else if(nome === 'modifica'){
    $vistaMod.style.display = 'block'; $tabModifica.classList.add('attivo'); popolaAnni();
    $hTitle.textContent = "Modifica"; $hSub.textContent = "Gestione dati esistenti";
  } else if(nome === 'visualizza'){
    $vistaVis.style.display = 'block'; $tabVisualizza.classList.add('attivo'); popolaAnniVis();
    $hTitle.textContent = "Visualizza"; $hSub.textContent = "Schede giornaliere";
  } else {
    $vistaPass.style.display = 'block'; $tabPassword.classList.add('attivo'); renderPassword();
    $hTitle.textContent = "Password operai"; $hSub.textContent = "Reimposta l'accesso di un dipendente";
  }
}
$tabInserisci.addEventListener('click', () => { try{ attivaTab('inserisci'); }catch(e){ alert('Errore: ' + e.message); } });
$tabModifica.addEventListener('click', () => { try{ attivaTab('modifica'); }catch(e){ alert('Errore: ' + e.message); } });
$tabVisualizza.addEventListener('click', () => { try{ attivaTab('visualizza'); }catch(e){ alert('Errore: ' + e.message); } });
$tabPassword.addEventListener('click', () => { try{ attivaTab('password'); }catch(e){ alert('Errore: ' + e.message); } });

function creaBlock(n){
  const div = document.createElement('div'); div.className = 'lavoro-block';
  div.innerHTML = `<div class="lavoro-block-header"><span class="lavoro-block-num">Attività ${n}</span>${n > 1 ? '<button type="button" class="btn-remove-block" onclick="rimuovi(this)">Rimuovi</button>' : ''}</div><div class="grid"><div class="col-6 field"><label>Luogo</label><input type="text" class="b-luogo" /></div><div class="col-6 field"><label>Ore Lavorate</label><input type="text" class="b-ore" /></div><div class="col-12 field"><label>Lavoro Svolto</label><textarea class="b-lavoro"></textarea></div></div>`;
  div.querySelector('.b-ore').addEventListener('input', aggiornaTotale);
  $container.appendChild(div);
}
function rimuovi(el){ el.closest('.lavoro-block').remove(); aggiornaTotale(); }
function aggiornaTotale(){
  let tot=0; $container.querySelectorAll('.b-ore').forEach(el=>{ const v=parseOre(el.value); if(!isNaN(v)) tot+=v; });
  $totText.textContent = fmt(tot)+' h';
}
$btnAggiungi.addEventListener('click',()=>creaBlock($container.querySelectorAll('.lavoro-block').length+1));

$form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = document.getElementById('data').value;
  const nome = document.getElementById('nome').value;
  if(!data || !nome) return mostraErrore($insErrore, "Inserisci Data e Dipendente");
  const attivita = [];
  $container.querySelectorAll('.lavoro-block').forEach(b => {
    attivita.push({luogo: b.querySelector('.b-luogo').value, ore: parseOre(b.querySelector('.b-ore').value), lavoro: b.querySelector('.b-lavoro').value});
  });
  $btnSalva.disabled = true;
  try{
    await apiCall('add-entry', { nome, data, attivita });
    const [anno, mese] = [data.split('-')[0], data.split('-')[1]];
    const key = `${anno}-${mese}`;
    if(!dati[key]) dati[key] = {};
    if(!dati[key][nome]) dati[key][nome] = [];
    const index = dati[key][nome].findIndex(item => item.data === data);
    if(index !== -1){ dati[key][nome][index].attivita.push(...attivita); }
    else { dati[key][nome].push({ attivita: attivita, data: data }); dati[key][nome].sort((a, b) => a.data.localeCompare(b.data)); }
    $btnSalvaLabel.textContent = "Salvato";
    mostraStatus("Attività registrata correttamente");
    setTimeout(() => $btnSalvaLabel.textContent = "Salva", 2000);
  }catch(err){
    mostraErrore($insErrore, err.message);
  }finally{
    $btnSalva.disabled = false;
  }
});

$btnPulisci.addEventListener('click', () => { $form.reset(); $container.innerHTML = ''; creaBlock(1); aggiornaTotale(); });

function popolaAnni(){
  const anni=[...new Set(Object.keys(dati).map(k=>k.slice(0,4)))].sort().reverse();
  $modAnno.innerHTML='<option value="">— Anno —</option>';
  anni.forEach(a=>{ const o=document.createElement('option'); o.value=a; o.textContent=a; $modAnno.appendChild(o); });
  $modMese.innerHTML='<option value="">— Mese —</option>';
  $modNome.innerHTML='<option value="">— Dipendente —</option>';
  $modResults.innerHTML='<div class="mod-empty">Seleziona anno, mese e dipendente per visualizzare i dati.</div>';
}
$modAnno.onchange = ()=>{
  $modMese.innerHTML='<option value="">— Mese —</option>';
  Object.keys(dati).filter(k=>k.startsWith($modAnno.value)).map(k=>k.slice(5,7)).forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=MESI[parseInt(m,10)-1]; $modMese.appendChild(o); });
};
$modMese.onchange = ()=>{
  $modNome.innerHTML='<option value="">— Dipendente —</option>';
  const k=$modAnno.value+'-'+$modMese.value;
  if(dati[k]) Object.keys(dati[k]).forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; $modNome.appendChild(o); });
};
$modNome.onchange = renderModifica;

function renderModifica(){
  $modResults.innerHTML='';
  const k=$modAnno.value+'-'+$modMese.value;
  if(!dati[k]||!dati[k][$modNome.value]) return;
  dati[k][$modNome.value].forEach((voce,vi)=>{
    const card=document.createElement('div'); card.className='mod-giorno';
    card.innerHTML=`<div class="mod-giorno-data">${formatData(voce.data)}</div>`;
    voce.attivita.forEach((att,ai)=>{
      const row=document.createElement('div'); row.className='mod-att-row';
      row.innerHTML=`<div class="mod-att-header"><span>Attività ${ai+1}</span><button type="button" class="btn-del-att">Elimina</button></div><input type="text" class="mod-luogo" value="${att.luogo}" /><input type="text" class="mod-ore" value="${att.ore}" /><textarea class="mod-lavoro" style="grid-column:1/-1;">${att.lavoro}</textarea>`;
      row.querySelector('.btn-del-att').onclick = ()=>{
        dati[k][$modNome.value][vi].attivita.splice(ai,1);
        if(dati[k][$modNome.value][vi].attivita.length==0) dati[k][$modNome.value].splice(vi,1);
        renderModifica();
      };
      card.appendChild(row);
    });
    $modResults.appendChild(card);
  });
}

$btnAnnulla.addEventListener('click', () => attivaTab('inserisci'));

$btnSalvaMod.onclick = async ()=>{
  const k=$modAnno.value+'-'+$modMese.value, n=$modNome.value;
  if(!k || k === '-' || !n) return mostraErrore($modErrore, "Seleziona anno, mese e dipendente");
  $btnSalvaMod.disabled = true;
  try{
    $modResults.querySelectorAll('.mod-giorno').forEach((card,vi)=>{
      const att=[];
      card.querySelectorAll('.mod-att-row').forEach(row=>{
        att.push({luogo:row.querySelector('.mod-luogo').value, ore:parseOre(row.querySelector('.mod-ore').value), lavoro:row.querySelector('.mod-lavoro').value});
      });
      dati[k][n][vi].attivita=att;
    });
    await apiCall('save-admin', { password: adminPassword, dati });
    const verifica = await apiCall('get-admin', { password: adminPassword });
    const salvatoOk = JSON.stringify(verifica.dati[k] && verifica.dati[k][n]) === JSON.stringify(dati[k] && dati[k][n]);
    alert(salvatoOk ? 'Verifica: i dati sul server corrispondono a quelli salvati.' : 'ATTENZIONE: i dati sul server NON corrispondono a quelli inviati.\n\nInviato: ' + JSON.stringify(dati[k] && dati[k][n]) + '\n\nSul server: ' + JSON.stringify(verifica.dati[k] && verifica.dati[k][n]));
    const L = $btnSalvaModLabel; L.textContent = "Modifiche salvate";
    mostraStatus("Modifiche salvate correttamente");
    setTimeout(()=>{ L.textContent="Salva modifiche"; }, 2500);
  }catch(err){
    alert('Errore salvataggio: ' + err.message);
    mostraErrore($modErrore, err.message);
  }finally{
    $btnSalvaMod.disabled = false;
  }
};

function renderPassword(){
  $opList.innerHTML = '';
  NOMI.forEach(nome => {
    const attiva = operai.includes(nome);
    const row = document.createElement('div'); row.className = 'op-row';
    row.innerHTML = `<div><div class="op-nome">${nome}</div><div class="op-stato">${attiva ? 'Password impostata' : 'Nessuna password'}</div></div>`;
    if(attiva){
      const btn = document.createElement('button');
      btn.className = 'btn btn-warning'; btn.textContent = 'Reimposta';
      btn.onclick = async () => {
        btn.disabled = true;
        try{
          await apiCall('reset-worker-password', { password: adminPassword, nome });
          operai = operai.filter(n => n !== nome);
          mostraStatus(nome + ": password rimossa");
          renderPassword();
        }catch(err){
          mostraErrore($passErrore, err.message);
        }finally{
          btn.disabled = false;
        }
      };
      row.appendChild(btn);
    }
    $opList.appendChild(row);
  });
}

let modoVis = 'dipendente';

$modoDipendente.addEventListener('click', () => {
  modoVis = 'dipendente';
  $modoDipendente.classList.add('attivo'); $modoLuogo.classList.remove('attivo');
  $campoDipendente.style.display = ''; $campoLuogo.style.display = 'none';
  $visLuogo.value = ''; $tabellaRisultati.innerHTML = '';
});
$modoLuogo.addEventListener('click', () => {
  modoVis = 'luogo';
  $modoLuogo.classList.add('attivo'); $modoDipendente.classList.remove('attivo');
  $campoLuogo.style.display = ''; $campoDipendente.style.display = 'none';
  $visNome.value = ''; $tabellaRisultati.innerHTML = '';
});

function popolaAnniVis(){
  alert('Diagnostica Visualizza: chiavi in dati = ' + Object.keys(dati).length + (Object.keys(dati).length ? (' (es: ' + Object.keys(dati)[0] + ')') : ''));
  const anni = [...new Set(Object.keys(dati).map(k => k.slice(0,4)))].sort().reverse();
  $visAnno.innerHTML = '<option value="">— Seleziona Anno —</option>';
  anni.forEach(a => { const o = document.createElement('option'); o.value=a; o.textContent=a; $visAnno.appendChild(o); });
  $visMese.innerHTML = '<option value="">— Seleziona Mese —</option>';
  $visNome.innerHTML = '<option value="">— Seleziona Dipendente —</option>';
  $visLuogo.value = ''; $tabellaRisultati.innerHTML = '';
}
$visAnno.onchange = () => {
  $visMese.innerHTML = '<option value="">— Seleziona Mese —</option>';
  Object.keys(dati).filter(k => k.startsWith($visAnno.value)).map(k => k.slice(5,7)).forEach(m => {
    const o = document.createElement('option'); o.value=m; o.textContent=MESI[parseInt(m,10)-1]; $visMese.appendChild(o);
  });
  $tabellaRisultati.innerHTML = '';
};
$visMese.onchange = () => {
  $visNome.innerHTML = '<option value="">— Seleziona Dipendente —</option>';
  const k = $visAnno.value + '-' + $visMese.value;
  if(dati[k]) Object.keys(dati[k]).forEach(n => { const o = document.createElement('option'); o.value=n; o.textContent=n; $visNome.appendChild(o); });
  $visLuogo.value = ''; $tabellaRisultati.innerHTML = '';
};
$visNome.onchange = renderTabellaDipendente;
$visLuogo.addEventListener('input', renderTabellaLuogo);

function attivaEvidenziazione(){
  $tabellaRisultati.querySelectorAll('.tabellaStampa tbody tr').forEach(tr => {
    tr.addEventListener('click', () => {
      const evidenziata = tr.dataset.evidenziata === '1';
      tr.dataset.evidenziata = evidenziata ? '0' : '1';
      tr.querySelectorAll('td').forEach(td => {
        if(evidenziata){ td.style.backgroundColor = ''; td.style.color = ''; }
        else { td.style.backgroundColor = '#ffeb3b'; td.style.color = '#000'; }
      });
    });
  });
}

function renderTabellaDipendente(){
  const k = $visAnno.value + '-' + $visMese.value;
  if(!dati[k] || !dati[k][$visNome.value]) { $tabellaRisultati.innerHTML = ''; return; }
  let html = `<table class="tabellaStampa"><thead><tr><th>Data</th><th>Luogo</th><th>Lavoro</th><th>Ore</th></tr></thead><tbody>`;
  let tot = 0, ultimaData = "";
  dati[k][$visNome.value].forEach(giorno => {
    giorno.attivita.forEach(att => {
      const [y,m,d] = giorno.data.split('-');
      const dataFormat = `${d}/${m}`;
      const visualizzaData = (dataFormat === ultimaData) ? "" : dataFormat;
      html += `<tr><td>${visualizzaData}</td><td>${att.luogo}</td><td>${att.lavoro}</td><td>${att.ore}h</td></tr>`;
      ultimaData = dataFormat; tot += att.ore;
    });
  });
  html += `</tbody><tfoot><tr><td colspan="3" style="text-align:right; font-weight:bold;">Totale:</td><td style="font-weight:bold;">${tot} h</td></tr></tfoot></table>`;
  $tabellaRisultati.innerHTML = html;
  attivaEvidenziazione();
}

function renderTabellaLuogo(){
  const k = $visAnno.value + '-' + $visMese.value;
  const query = $visLuogo.value.trim().toLowerCase();
  if(!dati[k] || !query) { $tabellaRisultati.innerHTML = ''; return; }
  const gruppi = {};
  Object.keys(dati[k]).sort().forEach(nome => {
    dati[k][nome].forEach(giorno => {
      giorno.attivita.forEach(att => {
        if(!att.luogo || !att.luogo.toLowerCase().includes(query)) return;
        if(!gruppi[nome]) gruppi[nome] = [];
        gruppi[nome].push({ data: giorno.data, luogo: att.luogo, lavoro: att.lavoro, ore: att.ore });
      });
    });
  });
  const nomiTrovati = Object.keys(gruppi);
  if(nomiTrovati.length === 0) { $tabellaRisultati.innerHTML = ''; return; }
  let html = '';
  nomiTrovati.forEach(nome => {
    let tot = 0, ultimaData = "";
    html += `<h3 style="margin:18px 0 6px; color:#60a5fa; font-size:0.95rem;">${nome}</h3>`;
    html += `<table class="tabellaStampa"><thead><tr><th>Data</th><th>Luogo</th><th>Lavoro</th><th>Ore</th></tr></thead><tbody>`;
    gruppi[nome].forEach(item => {
      const [y,m,d] = item.data.split('-');
      const dataFormat = `${d}/${m}`;
      const visualizzaData = (dataFormat === ultimaData) ? "" : dataFormat;
      html += `<tr><td>${visualizzaData}</td><td>${item.luogo}</td><td>${item.lavoro}</td><td>${item.ore}h</td></tr>`;
      ultimaData = dataFormat; tot += item.ore;
    });
    html += `</tbody><tfoot><tr><td colspan="3" style="text-align:right; font-weight:bold;">Totale:</td><td style="font-weight:bold;">${tot} h</td></tr></tfoot></table>`;
  });
  $tabellaRisultati.innerHTML = html;
  attivaEvidenziazione();
}

$btnScaricaPdf.addEventListener('click', async () => {
  if(!$tabellaRisultati.querySelector('table')){
    mostraErrore($visErrore, modoVis === 'luogo' ? 'Cerca un luogo' : 'Seleziona un dipendente');
    return;
  }
  const titolo = modoVis === 'luogo' ? $visLuogo.value : $visNome.value;
  $printArea.innerHTML = `<h1>Riepilogo: ${titolo}</h1>${$tabellaRisultati.innerHTML}`;

  const testoOriginale = $btnScaricaPdfLabel.textContent;
  $btnScaricaPdf.disabled = true;
  $btnScaricaPdfLabel.textContent = 'Generazione PDF...';

  try{
    const canvas = await html2canvas($printArea, { scale: 2, backgroundColor: '#ffffff' });
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    let heightLeft = imgHeight, position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    const nomeFile = `Riepilogo_${titolo.replace(/\s+/g,'_')}.pdf`;
    pdf.save(nomeFile);
  }catch(e){
    mostraErrore($visErrore, 'Errore nella generazione del PDF: ' + e.message);
  }finally{
    $btnScaricaPdf.disabled = false;
    $btnScaricaPdfLabel.textContent = testoOriginale;
  }
});
</script>

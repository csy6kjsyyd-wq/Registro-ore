<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Registro Ore</title>
<style>
:root{
  --bg: #080d1a;
  --card: #111c30;
  --card-border: rgba(96,165,250,.10);
  --muted: #6b7fa8;
  --text: #dce6f8;
  --text-dim: #a0b0cc;
  --blue: #60a5fa;
  --violet: #a78bfa;
  --shadow: 0 24px 48px rgba(0,0,0,.5);
  --radius: 14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{
  min-height:100%;
  background:
    radial-gradient(ellipse 900px 500px at 5% 0%, rgba(96,165,250,.13) 0%, transparent 65%),
    radial-gradient(ellipse 700px 400px at 95% 15%, rgba(167,139,250,.11) 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial;
  color:var(--text);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
}
.wrap{width:100%;max-width:420px;}
.header{text-align:center;margin-bottom:32px;}
.header h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--text),var(--violet));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.header p{color:var(--muted);font-size:.9rem;margin-top:6px;}
.card-link{
  display:flex;align-items:center;gap:16px;
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  padding:20px 22px;margin-bottom:16px;text-decoration:none;color:var(--text);
  transition:transform .15s,border-color .15s;
}
.card-link:active{transform:scale(.98);}
.card-link:hover{border-color:rgba(96,165,250,.35);}
.icon{
  width:46px;height:46px;border-radius:12px;flex-shrink:0;
  display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--violet));
  box-shadow:0 0 20px rgba(96,165,250,.25);
}
.icon svg{stroke:#fff;fill:none;}
.txt strong{display:block;font-size:1rem;font-weight:700;}
.txt span{display:block;color:var(--muted);font-size:.82rem;margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Registro Ore</h1>
    <p>Seleziona la sezione</p>
  </div>

  <a class="card-link" href="inserisci.html">
    <div class="icon"><svg width="20" height="20" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
    <div class="txt"><strong>Inserisci ore</strong><span>Modulo di registrazione giornaliera</span></div>
  </a>

  <a class="card-link" href="ore.html">
    <div class="icon"><svg width="20" height="20" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    <div class="txt"><strong>Le mie ore</strong><span>Consulta il tuo storico ore</span></div>
  </a>

  <a class="card-link" href="admin.html">
    <div class="icon"><svg width="20" height="20" stroke-width="2" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
    <div class="txt"><strong>Area riservata</strong><span>Accesso amministratore</span></div>
  </a>
</div>
</body>
</html>
